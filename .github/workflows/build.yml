name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.NEO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::NEO_KEYSTORE_B64 secret tanımlı değil; APK sabit anahtarla imzalanamaz."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neo.keystore"
          echo "NEO_KEYSTORE_FILE=$RUNNER_TEMP/neo.keystore" >> "$GITHUB_ENV"

      - name: APK derle
        env:
          NEO_KEYSTORE_PASSWORD: ${{ secrets.NEO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NeoArama-apk
          path: app/build/outputs/apk/debug/*.apk

      # En son APK, "apk" dalında NeoArama.apk olarak durur (telefondan kolay indirme için)
      - name: APK'yı apk dalına koy
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/NeoArama.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add NeoArama.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
